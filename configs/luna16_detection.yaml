candidate_training:
  data_dir: data/processed/luna16_candidate_dataset
  output_dir: data/processed/model_results/luna16_candidate_detector
  epochs: 8
  batch_size: 48
  learning_rate: 0.0002
  weight_decay: 0.0003
  base_channels: 8
  dropout: 0.25
  patience: 3
  seed: 42
  num_workers: 0

full_ct_detection:
  selected_runs: configs/lidc_stage4_selected_runs.yaml
  candidate_checkpoint: data/processed/model_results/luna16_candidate_detector/best_candidate_detector.pt
  response_percentile: 99.7
  max_proposals: 3000
  min_distance_mm: 3.0
  max_detections: 64
  nodule_threshold: 0.85
  min_proposal_score: 0.0
  candidate_batch_size: 64

full_ct_evaluation:
  annotations: E:/LUNA/annotations.csv
  candidate_checkpoint: data/processed/model_results/luna16_candidate_detector/best_candidate_detector.pt
  subsets:
    - subset9
  response_percentile: 99.7
  max_proposals: 3000
  min_distance_mm: 3.0
  max_detections: 64
  nodule_threshold: 0.85
  operating_thresholds:
    - 0.5
    - 0.7
    - 0.8
    - 0.85
    - 0.9
    - 0.95
  candidate_batch_size: 64
