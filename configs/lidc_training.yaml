common:
  task: multiclass
  scheduler: plateau
  monitor: val_f1
  metric_guard_enabled: 1
  metric_guard_warmup_epochs: 6
  metric_guard_patience: 3
  metric_guard_min_val_accuracy: 0.0
  metric_guard_max_val_loss: 2.0
  num_workers: 0
  seed: 42
  precision: "32-true"
  matmul_precision: medium
  normalization_mean: auto
  normalization_std: auto
  normalization_stats_samples: 128
  augment_rotate: true
  augment_flip: true
  augment_scale: true
  augment_cutout_fraction: 0.0
  attention: cbam
  enable_grad_cam: true
  grad_cam_max_samples: 12
  max_samples_per_split: null
  no_class_weights: false
  deterministic: false
  log_every_n_steps: 10

models:
  2d_resnet:
    model: resnet18
    epochs: 20
    batch_size: 16
    image_size: 224
    lr: 0.0001
    weight_decay: 0.0003
    early_stop_patience: 5
    early_stop_min_delta: 0.001
    metric_guard_min_val_auc_roc: 0.53
    metric_guard_min_val_f1: 0.12
    pretrained: false
    augment_scale_range: 0.03
    augment_noise_std: 0.003
    augment_intensity_shift: 0.01
    augment_contrast_range: 0.02
    class_weight_mode: fixed_multiclass
    custom_class_weights: null
    label_smoothing: 0.03
    dropout: 0.25
    fusion: none
    gradient_clip_val: 4.0
    gradient_clip_algorithm: norm

  2d_densenet:
    model: densenet121
    epochs: 20
    batch_size: 16
    image_size: 224
    lr: 0.00008
    weight_decay: 0.0003
    early_stop_patience: 5
    early_stop_min_delta: 0.001
    metric_guard_min_val_auc_roc: 0.53
    metric_guard_min_val_f1: 0.12
    pretrained: false
    augment_scale_range: 0.03
    augment_noise_std: 0.003
    augment_intensity_shift: 0.01
    augment_contrast_range: 0.02
    class_weight_mode: fixed_multiclass
    custom_class_weights: null
    label_smoothing: 0.03
    dropout: 0.20
    fusion: none
    gradient_clip_val: 4.0
    gradient_clip_algorithm: norm

  3d_resnet:
    model: resnet3d
    epochs: 30
    batch_size: 4
    lr: 0.00008
    weight_decay: 0.0003
    early_stop_patience: 7
    early_stop_min_delta: 0.002
    metric_guard_min_val_auc_roc: 0.55
    metric_guard_min_val_f1: 0.12
    augment_scale_range: 0.05
    augment_noise_std: 0.010
    augment_intensity_shift: 0.02
    augment_contrast_range: 0.04
    class_weight_mode: custom
    custom_class_weights: "1.15,0.90,1.30"
    balanced_sampler: 1
    balanced_sampler_power: 0.50
    label_smoothing: 0.01
    dropout: 0.24
    pca_features_enabled: 0
    pca_n_components: 0
    pca_hidden_dim: 16
    fusion: multiscale
    gradient_clip_val: 4.0
    gradient_clip_algorithm: norm

  3d_vnet:
    model: vnet
    epochs: 30
    batch_size: 4
    lr: 0.0001
    weight_decay: 0.0002
    early_stop_patience: 7
    early_stop_min_delta: 0.002
    metric_guard_min_val_auc_roc: 0.55
    metric_guard_min_val_f1: 0.12
    augment_scale_range: 0.05
    augment_noise_std: 0.010
    augment_intensity_shift: 0.02
    augment_contrast_range: 0.04
    class_weight_mode: custom
    custom_class_weights: "1.15,0.90,1.25"
    balanced_sampler: 1
    balanced_sampler_power: 0.55
    label_smoothing: 0.01
    dropout: 0.22
    pca_features_enabled: 0
    pca_n_components: 0
    pca_hidden_dim: 16
    fusion: none
    gradient_clip_val: 5.0
    gradient_clip_algorithm: norm
